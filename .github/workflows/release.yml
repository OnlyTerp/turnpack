name: Release

# Publishes to npm when a version tag is pushed, and attaches the Claude Desktop bundle
# (turnpack.mcpb) to a GitHub release for that tag:
#   npm version patch && git push --follow-tags
#
# One-time setup: add an npm automation token as the repository secret NPM_TOKEN.
# Packages are published with provenance, so npm shows which commit and workflow built them.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # to create the GitHub release that carries turnpack.mcpb
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Test, demo, doctor, leak gate
        run: |
          npm run verify
          node dist/cli.js demo
          node dist/cli.js doctor

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The file name carries no version, so this link always gives the newest bundle:
      # https://github.com/OnlyTerp/turnpack/releases/latest/download/turnpack.mcpb
      - name: Build the Claude Desktop bundle and attach it to the release
        run: |
          node scripts/build-mcpb.mjs
          gh release create "$GITHUB_REF_NAME" release/turnpack.mcpb --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
