name: Release

# Publishes to npm when a version tag is pushed, and attaches the Claude Desktop bundle
# (turnpack.mcpb) to a GitHub release for that tag:
#   npm version patch && git push --follow-tags
#
# One-time setup: add an npm automation token as the repository secret NPM_TOKEN.
# Packages are published with provenance, so npm shows which commit and workflow built them.
#
# A version that is already on npm is not published again: the run then only builds the bundle
# and attaches it. 0.1.0 was published by hand, so its tag takes that path. Running a release
# twice is safe for the same reason.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # to create the GitHub release that carries turnpack.mcpb
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Test, demo, doctor, leak gate
        run: |
          npm run verify
          node dist/cli.js demo
          node dist/cli.js doctor

      - name: Publish to npm with provenance (unless this version is already there)
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # Asked without credentials, so a missing token cannot make a published version look absent.
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
          if [ "$STATUS" = "200" ]; then
            echo "$NAME@$VERSION is already on npm. Not publishing it again."
          elif [ "$STATUS" = "404" ]; then
            npm publish --provenance --access public
          else
            echo "npm answered $STATUS for $NAME@$VERSION, so it is unclear whether it is published. Stopping." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The file name carries no version, so this link always gives the newest bundle:
      # https://github.com/OnlyTerp/turnpack/releases/latest/download/turnpack.mcpb
      - name: Build the Claude Desktop bundle and attach it to the release
        run: |
          node scripts/build-mcpb.mjs
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/turnpack.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/turnpack.mcpb --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
