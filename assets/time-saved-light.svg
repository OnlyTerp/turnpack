<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" width="1200" height="555" role="img" aria-label="Time saved by provider TTFT and token speed">
  <rect width="1200" height="555" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="58" y="48" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Real-World Waiting Time Saved by Provider Speed (16-Turn Task → 4 Turns)</text>
  <text x="58" y="74" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">The slower your model's Time-to-First-Token (TTFT) or token speed (tok/s), the bigger difference fewer turns makes:</text>

  <text x="58" y="114" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Fast / Warm-Cache API <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(2s TTFT + 5s stream = 7s/turn)</tspan></text><text x="708" y="114" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~1m 24s / task</text><rect x="58" y="124" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="124" width="51" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="139" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~1m 52s</text><rect x="58" y="149" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="149" width="14" height="20" rx="5" fill="#059669"/><text x="442" y="164" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~28s</text><text x="58" y="214" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Frontier Reasoning <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(6s TTFT + 12s stream = 18s/turn)</tspan></text><text x="708" y="214" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~3m 36s / task</text><rect x="58" y="224" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="224" width="133" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="239" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~4m 48s</text><rect x="58" y="249" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="249" width="33" height="20" rx="5" fill="#059669"/><text x="442" y="264" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~1m 12s</text><text x="58" y="314" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">High-TTFT / Busy API <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(15s TTFT + 20s stream = 35s/turn)</tspan></text><text x="708" y="314" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~7m 00s / task</text><rect x="58" y="324" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="324" width="259" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="339" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~9m 20s</text><rect x="58" y="349" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="349" width="64" height="20" rx="5" fill="#059669"/><text x="442" y="364" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~2m 20s</text><text x="58" y="414" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Slow-Prefill / Local GPU <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(25s TTFT + 25s @ 18 tok/s = 50s/turn)</tspan></text><text x="708" y="414" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~10m 00s / task</text><rect x="58" y="424" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="424" width="370" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="439" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~13m 20s</text><rect x="58" y="449" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="449" width="92" height="20" rx="5" fill="#059669"/><text x="442" y="464" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~3m 20s</text>

  <!-- Weekly Impact Highlight Box -->
  <rect x="738" y="104" width="414" height="390" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
  <rect x="762" y="126" width="366" height="28" rx="14" fill="#ECFDF5"/>
  <text x="945" y="145" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">WEEKLY HOURS RECLAIMED (20 tasks/day · 5d/wk)</text>
  <text x="762" y="178" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">12 eliminated round-trips × 100 tasks/week:</text>

  <rect x="762" y="196" width="366" height="44" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="223" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Fast Warm API (7s/turn)</text><text x="1112" y="223" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">~2.3 hrs / wk</text><rect x="762" y="250" width="366" height="44" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="277" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Frontier Reasoning (18s/turn)</text><text x="1112" y="277" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">~6.0 hrs / wk</text><rect x="762" y="304" width="366" height="44" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="331" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">High-TTFT / Busy (35s/turn)</text><text x="1112" y="331" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">~11.7 hrs / wk</text><rect x="762" y="358" width="366" height="44" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="385" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Local / Slow GPU (50s/turn)</text><text x="1112" y="385" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">~16.7 hrs / wk</text>

  <text x="762" y="434" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">+ Context grows slower too:</text>
  <text x="762" y="456" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Avoids 100k+ token TTFT spikes &amp; broken half-edits.</text>

  <text x="58" y="530" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Transparent math: turns_saved × (TTFT + tokens_per_turn ÷ tok/s). Plug in your own provider with npx turnpack estimate.</text>
</svg>
