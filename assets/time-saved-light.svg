<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Time saved across Local GPU warm KV cache and Cloud TTFT speeds">
  <rect width="1200" height="640" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="58" y="48" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Modeled Waiting Time: a 16-Round-Trip Task Done in 4</text>
  <text x="58" y="74" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">A model, not a benchmark: round trips avoided × your per-turn latency. Your turn counts will differ, so plug in your own.</text>

  <text x="58" y="114" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Local GPU · Warm KV <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(0.5s TTFT + 11s gen = 11.5s)</tspan></text><text x="708" y="114" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~2m 18s / task</text><rect x="58" y="124" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="124" width="85" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="139" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~3m 04s</text><rect x="58" y="149" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="149" width="21" height="20" rx="5" fill="#059669"/><text x="442" y="164" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~46s</text><text x="58" y="210" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Fast Warm Cloud API <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(2s TTFT + 5s stream = 7s)</tspan></text><text x="708" y="210" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~1m 24s / task</text><rect x="58" y="220" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="220" width="51" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="235" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~1m 52s</text><rect x="58" y="245" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="245" width="14" height="20" rx="5" fill="#059669"/><text x="442" y="260" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~28s</text><text x="58" y="306" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Frontier Cloud Reasoning <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(6s TTFT + 12s stream = 18s)</tspan></text><text x="708" y="306" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~3m 36s / task</text><rect x="58" y="316" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="316" width="133" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="331" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~4m 48s</text><rect x="58" y="341" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="341" width="33" height="20" rx="5" fill="#059669"/><text x="442" y="356" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~1m 12s</text><text x="58" y="402" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Busy / High-TTFT Cloud <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(15s TTFT + 20s stream = 35s)</tspan></text><text x="708" y="402" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~7m 00s / task</text><rect x="58" y="412" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="412" width="259" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="427" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~9m 20s</text><rect x="58" y="437" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="437" width="64" height="20" rx="5" fill="#059669"/><text x="442" y="452" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~2m 20s</text><text x="58" y="498" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Cold-Cache Cloud / Max-Think <tspan fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">(25s TTFT + 25s stream = 50s)</tspan></text><text x="708" y="498" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Save ~10m 00s / task</text><rect x="58" y="508" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="508" width="370" height="20" rx="5" fill="#E11D48" opacity="0.76"/><text x="442" y="523" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Normal 16t: ~13m 20s</text><rect x="58" y="533" width="370" height="20" rx="5" fill="#E2E8F0"/><rect x="58" y="533" width="92" height="20" rx="5" fill="#059669"/><text x="442" y="548" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Turnpack 4t: ~3m 20s</text>

