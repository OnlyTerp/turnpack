<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 475" width="1200" height="475" role="img" aria-label="Time saved visualization chart">
  <rect width="1200" height="475" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="58" y="54" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800">How much waiting time does fewer AI turns save?</text>
  <text x="58" y="80" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Illustrative model-wait math using an 8s average AI pause per round-trip (try your own numbers with npx turnpack estimate)</text>

  <text x="58" y="104" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Small 4-file tweak</text><text x="706" y="104" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">Save ~48s per task</text><rect x="58" y="116" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="116" width="114" height="24" rx="6" fill="#E11D48" opacity="0.72"/><text x="472" y="133" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Normal: 8 turns (~64s wait)</text><rect x="58" y="146" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="146" width="36" height="24" rx="6" fill="#059669"/><text x="472" y="163" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turnpack: 2 turns (~16s wait)</text><text x="58" y="212" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Typical 8-file feature</text><text x="706" y="212" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">Save ~1m 36s per task</text><rect x="58" y="224" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="224" width="228" height="24" rx="6" fill="#E11D48" opacity="0.72"/><text x="472" y="241" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Normal: 16 turns (~2m 08s)</text><rect x="58" y="254" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="254" width="57" height="24" rx="6" fill="#059669"/><text x="472" y="271" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turnpack: 4 turns (~32s wait)</text><text x="58" y="320" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Large refactor (15+ files)</text><text x="706" y="320" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">Save ~2m 48s per task</text><rect x="58" y="332" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="332" width="400" height="24" rx="6" fill="#E11D48" opacity="0.72"/><text x="472" y="349" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Normal: 28 turns (~3m 44s)</text><rect x="58" y="362" width="400" height="24" rx="6" fill="#E2E8F0"/><rect x="58" y="362" width="100" height="24" rx="6" fill="#059669"/><text x="472" y="379" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turnpack: 7 turns (~56s wait)</text>

  <!-- Weekly Impact Highlight Box -->
  <rect x="738" y="104" width="414" height="304" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
  <rect x="766" y="130" width="184" height="26" rx="13" fill="#ECFDF5"/>
  <text x="858" y="147" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">ACTIVE BUILDER IMPACT</text>
  <text x="766" y="182" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">20 typical tasks/day · 5 days/week:</text>
  <text x="766" y="242" fill="#059669" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">~2.7 hrs</text>
  <text x="766" y="270" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">reclaimed every single week</text>
  <text x="766" y="296" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">(~11.6 hours/month not staring at spinners)</text>

  <line x1="766" y1="322" x2="1124" y2="322" stroke="#CBD5E1" stroke-width="1"/>
  <text x="766" y="352" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">+ Built-in mistake protection:</text>
  <text x="766" y="376" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Broken multi-file edits auto-rewind in milliseconds.</text>

  <text x="58" y="448" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Transparent formula: prompts_per_day × turns_saved × seconds_per_turn. Run "npx turnpack estimate" or open docs/calculator.html.</text>
</svg>
