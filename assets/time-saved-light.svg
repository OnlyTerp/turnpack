  <text x="762" y="468" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">+ Built for Local GPUs &amp; Cloud alike:</text>
  <text x="762" y="490" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">• Local GPU: ~1.1k-token tool schema, bounded replies</text>
  <text x="762" y="510" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">• Cloud API: skips cold-cache 100k+ prefill &amp; queues</text>
  <text x="762" y="530" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">• Both: skips 12× token streams &amp; broken half-edits</text>

  <text x="58" y="612" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Formula: turns_saved × (TTFT + tokens_per_turn ÷ tok/s). Use your own numbers: npx turnpack estimate</text>
</svg>
