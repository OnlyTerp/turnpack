  <rect x="762" y="124" width="366" height="28" rx="14" fill="#ECFDF5"/>
  <text x="945" y="143" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">MODELED HOURS / WEEK (20 tasks/day · 5d/wk)</text>
  <text x="762" y="174" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">If each task really drops 12 round trips:</text>

  <rect x="762" y="190" width="366" height="42" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="216" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Local GPU · 0.5s TTFT (11.5s/t)</text><text x="1112" y="216" text-anchor="end" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">~3.8 hrs / wk</text><rect x="762" y="240" width="366" height="42" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="266" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Fast Warm Cloud API (7s/t)</text><text x="1112" y="266" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">~2.3 hrs / wk</text><rect x="762" y="290" width="366" height="42" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="316" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Frontier Cloud (18s/t)</text><text x="1112" y="316" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">~6.0 hrs / wk</text><rect x="762" y="340" width="366" height="42" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="778" y="366" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Busy / High-TTFT Cloud (35s/t)</text><text x="1112" y="366" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">~11.7 hrs / wk</text><rect x="762" y="390" width="366" height="42" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-