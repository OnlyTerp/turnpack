<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" role="img" aria-label="Without Turnpack vs With Turnpack workflow comparison">
  <rect width="1200" height="525" rx="20" fill="#0B0F17" stroke="#243044" stroke-width="1.5"/>

  <!-- Left Card: Normal AI Loop -->
  <rect x="34" y="30" width="552" height="465" rx="16" fill="#111827" stroke="#243044" stroke-width="1.2"/>
  <rect x="64" y="54" width="142" height="26" rx="13" fill="#4C0519" stroke="#F43F5E" stroke-width="1"/>
  <text x="135" y="72" text-anchor="middle" fill="#FDA4AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">NORMAL AI LOOP</text>
  <text x="64" y="106" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">Repeated stop-and-go round trips</text>
  <rect x="64" y="122" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="149" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 1</text><text x="150" y="149" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Search where calculateTax is defined</text><rect x="64" y="175" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="202" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 2</text><text x="150" y="202" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Pause... read tax.ts</text><rect x="64" y="228" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="255" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 3</text><text x="150" y="255" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Pause... read invoice.ts</text><rect x="64" y="281" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="308" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 4</text><text x="150" y="308" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Pause... read checkout.ts</text><rect x="64" y="334" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="361" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 5</text><text x="150" y="361" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Pause... read cart.test.ts</text><rect x="64" y="387" width="492" height="44" rx="9" fill="#1E293B" stroke="#243044" stroke-width="1"/><text x="82" y="414" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 6</text><text x="150" y="414" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Edit tax.ts → save → edit invoice.ts</text><rect x="64" y="440" width="492" height="44" rx="9" fill="#4C0519" stroke="#F43F5E" stroke-width="1"/><text x="82" y="467" fill="#FDA4AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Turn 7+</text><text x="150" y="467" fill="#FDA4AF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Run tests → FAIL → messy half-edited files left behind</text>

  <!-- Arrow Badge Center -->
  <circle cx="600" cy="262" r="24" fill="#10B981" stroke="#0B0F17" stroke-width="4"/>
  <text x="600" y="269" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">→</text>

  <!-- Right Card: With Turnpack -->
  <rect x="614" y="30" width="552" height="465" rx="16" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <rect x="644" y="54" width="166" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="727" y="72" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">WITH TURNPACK</text>
  <text x="644" y="106" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">Bundle reads, verify edits, or rewind clean</text>

  <!-- Step 1 -->
  <rect x="644" y="132" width="492" height="148" rx="14" fill="#162032" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="664" y="150" width="84" height="24" rx="6" fill="#0C4A6E"/>
  <text x="706" y="166" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">STEP 1 · pack</text>
  <text x="760" y="167" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">1 local call (~19ms engine)</text>
  <text x="664" y="198" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Gather everything the AI needs in one trip</text>
  <text x="664" y="224" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Searches patterns + slices exact files &amp; functions together</text>
  <text x="664" y="246" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Automatically shields .env, .pem &amp; private keys by default</text>
  <text x="664" y="268" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Splits giant outputs cleanly so your chat never overflows</text>

  <!-- Step 2 -->
  <rect x="644" y="302" width="492" height="168" rx="14" fill="#162032" stroke="#10B981" stroke-width="1.2"/>
  <rect x="664" y="320" width="84" height="24" rx="6" fill="#064E3B"/>
  <text x="706" y="336" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">STEP 2 · ship</text>
  <text x="760" y="337" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">All-or-nothing safety net</text>
  <text x="664" y="368" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Apply multi-file edits + test in one boundary</text>
  <text x="664" y="394" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Validates every file before writing anything to disk</text>
  <text x="664" y="416" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Runs your test / typecheck command right after writing</text>
  <rect x="664" y="428" width="452" height="28" rx="7" fill="#064E3B"/>
  <text x="678" y="447" fill="#6EE7B7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Tests pass → SHIPPED   |   Tests fail → byte-exact auto rollback</text>
</svg>
