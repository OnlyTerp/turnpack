<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Turnpack: fewer back-and-forth AI turns">
  <defs>
    <linearGradient id="social-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="social-glow" cx="85%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0B0F17"/>
  <rect width="1280" height="640" fill="url(#social-glow)"/>

  <g transform="translate(80, 64)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#social-accent)"/>
    <rect x="15" y="15" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="15" y="28" width="26" height="8" rx="4" fill="#FFFFFF" opacity="0.80"/>
    <rect x="15" y="41" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <text x="164" y="108" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.6">turnpack</text>

  <text x="80" y="218" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.6">Edits that are tested</text>
  <text x="80" y="286" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.6">before they stay.</text>
  <text x="80" y="334" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25">A local MCP server for AI coding agents. Tests fail? Every file goes back.</text>

  <rect x="80" y="372" width="352" height="124" rx="16" fill="#111827" stroke="#243044" stroke-width="1.5"/><text x="106" y="414" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">pack</text><text x="106" y="448" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Search, with the code</text><text x="106" y="474" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">around every hit</text><rect x="464" y="372" width="352" height="124" rx="16" fill="#111827" stroke="#243044" stroke-width="1.5"/><text x="490" y="414" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">ship</text><text x="490" y="448" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Edit, test, and undo</text><text x="490" y="474" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">if the tests fail</text><rect x="848" y="372" width="352" height="124" rx="16" fill="#111827" stroke="#243044" stroke-width="1.5"/><text x="874" y="414" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">batch</text><text x="874" y="448" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">One read-only script</text><text x="874" y="474" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">instead of 40 reads</text>

  <rect x="80" y="536" width="322" height="50" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="104" y="569" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">npx turnpack demo</text>
  <text x="1200" y="560" text-anchor="end" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">6 → 3 round trips · 46% faster · 36% cheaper</text>
  <text x="1200" y="586" text-anchor="end" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Measured on one task in Claude Code · no API keys · zero dependencies</text>
</svg>
