<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="TTFT and slow token streaming tax across 16 tool calls vs 4 Turnpack calls">
  <rect width="1200" height="490" rx="20" fill="#0B0F17" stroke="#243044" stroke-width="1.5"/>

  <text x="58" y="48" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23.5" font-weight="800">Why AI Tool Loops Feel Slow: Cloud TTFT + Repeated Token Streams</text>
  <text x="58" y="74" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Even when reading a file takes 0.02s on disk, every separate tool call triggers another full model generation turn:</text>

  <!-- Section A: Anatomy of ONE Tool Call -->
  <rect x="44" y="94" width="1112" height="148" rx="14" fill="#111827" stroke="#243044" stroke-width="1.2"/>
  <text x="64" y="120" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">ANATOMY OF ONE INTERMEDIATE AI TOOL CALL</text>

  <rect x="64" y="132" width="446" height="42" rx="8" fill="#F43F5E" opacity="0.85"/>
  <text x="287" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">1. Cloud TTFT Freeze: 2s–25s+  (Local Warm KV: &lt;1s)</text>

  <rect x="514" y="132" width="538" height="42" rx="8" fill="#F59E0B" opacity="0.86"/>
  <text x="783" y="158" text-anchor="middle" fill="#0B0F17" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">2. Thinking &amp; Token Stream (18–45 tok/s): 5s–25s+</text>

  <rect x="1056" y="132" width="80" height="42" rx="8" fill="#10B981"/>
  <text x="1096" y="158" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">0.02s tool</text>

  <circle cx="72" cy="196" r="5" fill="#F43F5E"/>
  <text x="84" y="201" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Cloud TTFT: API queues, cold-cache routers &amp; deep-thinking prefill (2s–25s+). Dedicated local GPUs hit &lt;1s TTFT.</text>
  <circle cx="72" cy="218" r="5" fill="#F59E0B"/>
  <text x="84" y="223" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Token Stream (Cloud &amp; Local): 225–450+ reasoning/tool tokens generated per step — plus raw dumps bloat VRAM KV cache.</text>

  <!-- Section B: 16 Calls vs 4 Calls -->
  <text x="58" y="284" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Normal Chatty Loop — 16 separate tool calls</text>
  <text x="1142" y="284" text-anchor="end" fill="#F43F5E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">16 × (TTFT + token stream) = 2 to 13+ minutes waiting</text>
  <rect x="52" y="308" width="1096" height="52" rx="10" fill="#111827" stroke="#243044" stroke-width="1"/>
  <rect x="58" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="84" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="118" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="144" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="178" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="204" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="238" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="264" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="298" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="324" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="358" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="384" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="418" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="444" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="478" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="504" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="538" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="564" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="598" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="624" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="658" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="684" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="718" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="744" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="778" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="804" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="838" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="864" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="898" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="924" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="958" y="318" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="984" y="318" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/>
  <text x="1030" y="339" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">16× PAID</text>

  <text x="58" y="378" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">With Turnpack — 4 bundled calls (pack + ship)</text>
  <rect x="52" y="390" width="1096" height="44" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.3"/>
  <rect x="58" y="396" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="84" y="396" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="118" y="396" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="144" y="396" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="178" y="396" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="204" y="396" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/><rect x="238" y="396" width="24" height="32" rx="4" fill="#F43F5E" opacity="0.88"/><rect x="264" y="396" width="30" height="32" rx="4" fill="#F59E0B" opacity="0.82"/>
  <rect x="308" y="396" width="832" height="32" rx="6" fill="#064E3B"/>
  <text x="724" y="417" text-anchor="middle" fill="#6EE7B7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">12 extra turns skipped (~75% less waiting + cleaner context &amp; local VRAM KV cache)</text>

  <text x="58" y="466" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Red = TTFT wait per call (2s–25s+ Cloud; &lt;1s Local)   ·   Amber = Token stream per call   ·   Green = Turns skipped with Turnpack</text>
</svg>
