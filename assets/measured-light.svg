<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Measured: the same task with and without Turnpack">
  <rect width="1200" height="470" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="44" y="52" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Measured: the same task, with and without Turnpack</text>
  <text x="44" y="80" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Rename a function used in five files, then make the tests pass. Claude Code 2.1.280 with Claude Sonnet 5, median of 3 runs each, nothing in the prompt about Turnpack.</text>

  <rect x="44" y="112" width="266" height="252" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="66" y="144" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">MODEL ROUND TRIPS</text><text x="66" y="204" fill="#059669" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">−50%</text><text x="66" y="246" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Built-in tools</text><text x="288" y="246" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">6</text><rect x="66" y="255" width="222" height="14" rx="4" fill="#64748B" opacity="0.55"/><text x="66" y="306" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">With Turnpack</text><text x="288" y="306" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">3</text><rect x="66" y="315" width="222" height="14" rx="4" fill="#E2E8F0"/><rect x="66" y="315" width="111" height="14" rx="4" fill="#059669"/><rect x="326" y="112" width="266" height="252" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="348" y="144" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">TIME</text><text x="348" y="204" fill="#059669" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">−46%</text><text x="348" y="246" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Built-in tools</text><text x="570" y="246" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">23.4 s</text><rect x="348" y="255" width="222" height="14" rx="4" fill="#64748B" opacity="0.55"/><text x="348" y="306" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">With Turnpack</text><text x="570" y="306" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">12.7 s</text><rect x="348" y="315" width="222" height="14" rx="4" fill="#E2E8F0"/><rect x="348" y="315" width="120" height="14" rx="4" fill="#059669"/><rect x="608" y="112" width="266" height="252" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="630" y="144" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">OUTPUT TOKENS</text><text x="630" y="204" fill="#059669" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">−57%</text><text x="630" y="246" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Built-in tools</text><text x="852" y="246" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">2,044</text><rect x="630" y="255" width="222" height="14" rx="4" fill="#64748B" opacity="0.55"/><text x="630" y="306" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">With Turnpack</text><text x="852" y="306" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">873</text><rect x="630" y="315" width="222" height="14" rx="4" fill="#E2E8F0"/><rect x="630" y="315" width="95" height="14" rx="4" fill="#059669"/><rect x="890" y="112" width="266" height="252" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="912" y="144" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">COST</text><text x="912" y="204" fill="#059669" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">−36%</text><text x="912" y="246" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Built-in tools</text><text x="1134" y="246" text-anchor="end" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">$0.131</text><rect x="912" y="255" width="222" height="14" rx="4" fill="#64748B" opacity="0.55"/><text x="912" y="306" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">With Turnpack</text><text x="1134" y="306" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">$0.084</text><rect x="912" y="315" width="222" height="14" rx="4" fill="#E2E8F0"/><rect x="912" y="315" width="143" height="14" rx="4" fill="#059669"/>

  <rect x="44" y="384" width="1112" height="56" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="408" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">The built-in tools were already batching: 13 tool calls in 6 round trips. Turnpack: 2 tool calls in 3.</text>
  <text x="64" y="428" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Asked to batch harder, they took 5 round trips and 23.9 s. The gain is in the steps that depend on each other: search then read, edit then test.</text>
  <text x="1136" y="418" text-anchor="end" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">npm run bench:agents</text>
</svg>
