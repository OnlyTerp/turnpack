<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" role="img" aria-label="The same rename task: six round trips with built-in tools, three with Turnpack">
  <rect width="1200" height="525" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left card: the built-in tools -->
  <rect x="34" y="30" width="552" height="465" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="64" y="54" width="142" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="135" y="72" text-anchor="middle" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">BUILT-IN TOOLS</text>
  <text x="64" y="106" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">6 round trips · 13 tool calls · 23.4 s</text>
  <rect x="64" y="122" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="149" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 1</text><text x="150" y="149" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Search for calculateTax</text><text x="538" y="149" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">1 call</text><rect x="64" y="175" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="202" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 2</text><text x="150" y="202" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Read the 5 files it found</text><text x="538" y="202" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">5 calls</text><rect x="64" y="228" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="255" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 3</text><text x="150" y="255" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Edit the 5 files, one call per file</text><text x="538" y="255" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">5 calls</text><rect x="64" y="281" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="308" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 4</text><text x="150" y="308" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Read package.json to find the test command</text><text x="538" y="308" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">1 call</text><rect x="64" y="334" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="361" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 5</text><text x="150" y="361" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Run npm test</text><text x="538" y="361" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">1 call</text><rect x="64" y="387" width="492" height="44" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="82" y="414" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 6</text><text x="150" y="414" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Report back</text><text x="538" y="414" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"></text><rect x="64" y="440" width="492" height="44" rx="9" fill="#FFF1F2" stroke="#E11D48" stroke-width="1"/><text x="82" y="467" fill="#BE123C" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Had the tests failed at trip 5, five files were already changed.</text>

  <!-- Arrow Badge Center -->
  <circle cx="600" cy="262" r="24" fill="#059669" stroke="#F8FAFC" stroke-width="4"/>
  <text x="600" y="269" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">→</text>

  <!-- Right card: with Turnpack -->
  <rect x="614" y="30" width="552" height="465" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="644" y="54" width="166" height="26" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="727" y="72" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">WITH TURNPACK</text>
  <text x="644" y="106" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">3 round trips · 2 tool calls · 12.7 s</text>

  <!-- Trip 1 -->
  <rect x="644" y="122" width="492" height="146" rx="14" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.2"/>
  <rect x="664" y="138" width="118" height="24" rx="6" fill="#E0F2FE"/>
  <text x="723" y="154" text-anchor="middle" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">TRIP 1 · pack</text>
  <text x="796" y="155" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">does the work of trips 1, 2 and 4</text>
  <text x="664" y="186" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">The search comes back with the code around each hit</text>
  <text x="664" y="212" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• One call found all 5 files and showed the lines that matter</text>
  <text x="664" y="234" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• The server had already named the test command: npm test</text>
  <text x="664" y="256" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• .env and key files are redacted, and the reply is size-capped</text>

  <!-- Trip 2 -->
  <rect x="644" y="280" width="492" height="158" rx="14" fill="#F1F5F9" stroke="#059669" stroke-width="1.2"/>
  <rect x="664" y="296" width="118" height="24" rx="6" fill="#ECFDF5"/>
  <text x="723" y="312" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">TRIP 2 · ship</text>
  <text x="796" y="313" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">does the work of trips 3 and 5</text>
  <text x="664" y="344" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">9 edits in 5 files and npm test, in one call</text>
  <text x="664" y="370" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Every edit is checked before anything is written to disk</text>
  <text x="664" y="392" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">• Then the tests run, in the same call</text>
  <rect x="664" y="402" width="452" height="26" rx="7" fill="#ECFDF5"/>
  <text x="678" y="420" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Tests pass → SHIPPED   |   Tests fail → every file put back as it was</text>

  <!-- Trip 3 -->
  <rect x="644" y="448" width="492" height="34" rx="9" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="662" y="470" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">Trip 3</text>
  <text x="730" y="470" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Report back</text>
</svg>
