"778" y="318" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="804" y="318" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="838" y="318" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="864" y="318" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="898" y="318" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="924" y="318" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="958" y="318" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="984" y="318" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/>
  <text x="1030" y="339" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">16× PAID</text>

  <text x="58" y="378" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">With Turnpack — 4 bundled calls (pack + ship)</text>
  <rect x="52" y="390" width="1096" height="44" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  <rect x="58" y="396" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="84" y="396" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="118" y="396" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="144" y="396" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="178" y="396" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="204" y="396" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/><rect x="238" y="396" width="24" height="32" rx="4" fill="#E11D48" opacity="0.88"/><rect x="264" y="396" width="30" height="32" rx="4" fill="#D97706" opacity="0.82"/>
  <rect x="308" y="396" width="832" height="32" rx="6" fill="#ECFDF5"/>
  <text x="724" y="417" text-anchor="middle" fill="#047857" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">12 repeated TTFT freezes + 12 intermediate token streams eliminated (~75% less dead waiting)</text>

  <text x="58" y="466" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Red = TTFT dead wait per call   ·   Amber = Slow token stream per call   ·   Green = Time your AI skips completely with Turnpack</text>
