<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="TTFT and slow token streaming tax across 16 tool calls vs 4 Turnpack calls">
  <rect width="1200" height="490" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="58" y="48" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23.5" font-weight="800">Why AI Tool Loops Feel So Slow: You Pay TTFT + Slow Tokens on Every Step</text>
  <text x="58" y="74" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Even when reading a file takes 0.02s locally, every separate tool call forces a brand-new provider round-trip:</text>

  <!-- Section A: Anatomy of ONE Tool Call -->
  <rect x="44" y="94" width="1112" height="148" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="64" y="120" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">ANATOMY OF ONE INTERMEDIATE AI TOOL CALL</text>

  <rect x="64" y="132" width="446" height="42" rx="8" fill="#E11D48" opacity="0.85"/>
  <text x="287" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">1. Time to First Token (TTFT): 5s–25s+ dead freeze</text>

  <rect x="514" y="132" width="538" height="42" rx="8" fill="#D97706" opacity="0.86"/>
  <text x="783" y="158" text-anchor="middle" fill="#0B0F17" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">2. Thinking &amp; Slow Token Stream (15–40 tok/s): 5s–25s+</text>

  <rect x="1056" y="132" width="80" height="42" rx="8" fill="#059669"/>
  <text x="1096" y="158" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">0.02s tool</text>

  <circle cx="72" cy="196" r="5" fill="#E11D48"/>
  <text x="84" y="201" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">TTFT (Startup Freeze): Queueing + re-reading growing chat history before a single word appears.</text>
  <circle cx="72" cy="218" r="5" fill="#D97706"/>
  <text x="84" y="223" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Token Wait: Thinking &amp; tool JSON streamed token-by-token.   Local execution (~20ms) is practically instant.</text>

  <!-- Section B: 16 Calls vs 4 Calls -->
  <text x="58" y="284" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Normal Chatty Loop — 16 separate tool calls</text>
  <text x="1142" y="284" text-anchor="end" fill="#E11D48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">16 × (TTFT + token wait) = 5 to 13+ minutes waiting</text>
  <rect x="52" y="308" width="1096" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
